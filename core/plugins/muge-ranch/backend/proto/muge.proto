syntax = "proto3";

package gamepb.mugepb;

import "corepb.proto";

// 牧歌初启（2026111700，type 1）与四个子活动。
//
// 字段号全部来自 2026-11-17 官方客户端实机抓包（gate-obt.nqf.qq.com），
// 证据样本：
//   - GetGroup(2026111702) → group.children[0].126 = 兴牧庆典 body
//   - Operate(2026111702, cmd=85) → reply.185 = { ids[1,2,3,4], rewards[80021×5, 80031×5, 1007×25000, ...] }
//   - Operate(2026111703, cmd=84) → reply.184 = 牧友同行领取
//   - Operate(2026111704, cmd=82) → reply.182 = { ids[3], rewards[1007×1500] }
//   - Operate(2026111704, cmd=83) → reply.183 = { ids[1], rewards[80021×5] }
// Operate 的 action 槽位规律：field = 100 + cmd（cmd 82→182 … 85→185）。
//
// 牧场人格（2026111705，type 31）协议来自上游客户端生成代码与实测实现：
//   - body → ActivityNode field 127（MugeSurvey）
//   - Operate cmd 86 → 请求 186（survey_save），答题进度保存
//   - Operate cmd 87 → 请求 187（settle），结算人格
//   - Operate cmd 89 → 请求 189（claim_share），领取首次分享奖励

// ---- 活动节点 ----

message MugeActivityInfo {
  int64 id = 1;
  int64 parent_id = 2;
  int32 type = 3;
  string title = 4;
  string payload = 5;
  int64 start_time = 6;
  int64 end_time = 7;
  int32 sort = 8;
  bool visible = 20;
  int32 status = 21;
  bool enabled = 22;
  int64 extra_flag_23 = 23;   // 语义未确认：子活动恒为 1
  int64 extra_time_24 = 24;   // 语义未确认：与 end_time 相同
}

// 档位奖励（兴牧庆典 / 牧友同行 / 成长手册阶段共用同一布局）
message MugeRewardTier {
  int64 id = 1;
  int64 threshold = 2;        // 兴牧庆典=全服饲养数，牧友同行=好友数，成长手册=任务数
  corepb.Item reward = 3;
  int32 state = 4;            // 1=未达成 2=可领取 3=已领取（2→3 在 cmd 83 回包中实证）
}

// type 28 兴牧庆典 → ActivityNode field 126
message MugeCelebrationBody {
  int64 total = 1;                    // 全服累计饲养数
  repeated MugeRewardTier tiers = 2;
}

// type 29 牧友同行 → ActivityNode field 125
message MugeFriendProfile {
  int64 gid = 1;
  string avatar = 2;
  string nickname = 3;
  int64 level = 4;                    // 语义未确认：样本 2163，与农场等级量级一致
  repeated MugeFriendStat stats = 5;
}

message MugeFriendStat {
  int32 type = 1;
  int64 value = 2;
}

message MugeFriendBody {
  repeated MugeRewardTier tiers = 1;
  repeated MugeFriendProfile friends = 2;   // 已开启牧场的好友
}

// 成长手册任务
message MugeManualTask {
  int64 id = 1;
  int64 progress = 2;
  int64 target = 3;
  int32 state = 4;            // 1=可领取 3=已领取 4=未解锁（阶段 1 内实证 1→3，其它阶段恒 4）
  corepb.Item reward = 5;
  string title = 6;
  int32 stage = 7;            // 所属阶段，1..8
}

// type 30 成长手册 → ActivityNode field 124
message MugeManualBody {
  repeated MugeManualTask tasks = 1;
  int64 extra = 2;            // 语义未确认：样本恒为 30
  repeated MugeRewardTier stages = 3;
}

// type 31 牧场人格 → ActivityNode field 127
message MugeSurvey {
  map<int64, int64> answers = 1;      // 题目 id → 选项 value
  int64 personality_id = 2;           // 0=尚未结算
  int64 settle_count = 3;             // 已结算次数
  bool share_reward_claimed = 4;      // 首次分享奖励是否已领取
}

message MugeNode {
  MugeActivityInfo activity = 1;
  repeated MugeNode children = 2;
  MugeManualBody manual = 124;
  MugeFriendBody friend = 125;
  MugeCelebrationBody celebration = 126;
  MugeSurvey survey = 127;
}

message MugeGetGroupRequest {
  int64 id = 1;
}

message MugeGetGroupReply {
  MugeNode group = 1;
}

// ActivityService.List 回包：一次拿到所有活动节点（上游牧场人格即用此读取）
message MugeListRequest {}

message MugeListReply {
  repeated MugeNode groups = 1;
}

// ---- Operate ----

message MugeClaimParams {
  int64 id = 1;               // 样本恒为 0：交给服务端按可领取清单处理
}

message MugeSurveySaveParams {
  map<int64, int64> answers = 1;          // 题目 id → 选项 value
  bool clear = 2;                         // 重新测试时清空进度
}

message MugeSurveyClaimParams {
  string share_id = 1;                    // 实测可留空
}

message MugeEmpty {}

message MugeOperateRequest {
  int64 id = 1;
  int64 cmd = 2;
  MugeClaimParams manual_task = 182;      // cmd 82
  MugeClaimParams manual_stage = 183;     // cmd 83
  MugeClaimParams friend = 184;           // cmd 84
  MugeClaimParams celebration = 185;      // cmd 85
  MugeSurveySaveParams survey_save = 186; // cmd 86
  MugeEmpty settle = 187;                 // cmd 87
  MugeSurveyClaimParams claim_share = 189; // cmd 89
}

message MugeClaimResult {
  repeated int64 ids = 1;                 // 本次实际领取的档位/任务 id
  repeated corepb.Item rewards = 2;
}

message MugeSurveyResult {
  int64 personality_id = 1;
  int64 percent_bp = 2;
}

message MugeSurveyShareResult {
  repeated corepb.Item rewards = 1;
}

message MugeOperateReply {
  int64 id = 1;
  int64 cmd = 2;
  MugeNode group = 3;
  MugeClaimResult manual_task = 182;
  MugeClaimResult manual_stage = 183;
  MugeClaimResult friend = 184;
  MugeClaimResult celebration = 185;
  MugeEmpty survey_save = 186;
  MugeSurveyResult settle = 187;
  MugeSurveyShareResult claim_share = 189;
}
